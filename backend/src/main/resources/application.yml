spring:
  application:
    name: restaurant-manager-backend-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_FILE_SIZE:5MB}
  mail:
    # Set SPRING_MAIL_HOST (and EMAIL_PROVIDER=smtp) to enable SMTP; leaving the host unset keeps mail disabled.
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${PORT:8080}

websocket:
  allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:19006}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

app:
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:3000}
  venue-name: ${VENUE_NAME:Restaurant}
  timezone: ${APP_TIMEZONE:Africa/Accra}
  push:
    # "expo" sends through the Expo push service (Expo Go and EAS builds); "log" only writes messages to the log.
    provider: ${PUSH_PROVIDER:log}
    expo-endpoint: ${EXPO_PUSH_ENDPOINT:https://exp.host/--/api/v2/push/send}
    # Optional: required only if "enhanced push security" is turned on for the Expo project.
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  orders:
    # Branch for customer/guest orders that don't get one from a table, the staff creator,
    # the request or the delivery zone. Leave empty to use the only active branch (if there is one).
    default-branch-code: ${ORDER_DEFAULT_BRANCH_CODE:}
  cache:
    redis-enabled: ${CACHE_REDIS_ENABLED:false}
    default-ttl-seconds: ${CACHE_DEFAULT_TTL_SECONDS:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:19006}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:20}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
    pin-requests: ${RATE_LIMIT_PIN_REQUESTS:5}
    pin-window-seconds: ${RATE_LIMIT_PIN_WINDOW_SECONDS:300}
    public-requests: ${RATE_LIMIT_PUBLIC_REQUESTS:120}
    public-window-seconds: ${RATE_LIMIT_PUBLIC_WINDOW_SECONDS:60}
    hr-clock-requests: ${RATE_LIMIT_HR_CLOCK_REQUESTS:60}
    hr-clock-window-seconds: ${RATE_LIMIT_HR_CLOCK_WINDOW_SECONDS:60}

security:
  jwt:
    secret: ${JWT_SECRET:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
    override-ttl-seconds: ${JWT_OVERRIDE_TTL_SECONDS:300}
  pin:
    max-failed-attempts: ${PIN_MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${PIN_LOCKOUT_MINUTES:30}

payments:
  default-currency: ${PAYMENTS_DEFAULT_CURRENCY:GHS}
  paystack:
    mode: ${PAYSTACK_MODE:stub}
    secret-key: ${PAYSTACK_SECRET_KEY:test_paystack_secret}
    base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
    callback-url: ${PAYSTACK_CALLBACK_URL:}
    customer-email-domain: ${PAYSTACK_CUSTOMER_EMAIL_DOMAIN:customers.restaurant.local}
  reconciliation:
    enabled: ${PAYMENTS_RECONCILIATION_ENABLED:true}
    pending-older-than-minutes: ${PAYMENTS_RECONCILIATION_PENDING_OLDER_THAN_MINUTES:15}
    batch-size: ${PAYMENTS_RECONCILIATION_BATCH_SIZE:200}
    fixed-delay-ms: ${PAYMENTS_RECONCILIATION_FIXED_DELAY_MS:60000}

auth:
  otp:
    required-for-registration: ${OTP_REQUIRED_FOR_REGISTRATION:true}
    code-length: ${OTP_CODE_LENGTH:6}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    app-name: ${VENUE_NAME:Restaurant}

loyalty:
  auto-accrue: ${LOYALTY_AUTO_ACCRUE:true}
  points-per-cedi: ${LOYALTY_POINTS_PER_CEDI:1}
  point-value: ${LOYALTY_POINT_VALUE:0.01}
  max-redeem-percent: ${LOYALTY_MAX_REDEEM_PERCENT:50}

media:
  provider: ${MEDIA_PROVIDER:local}
  local-dir: ${MEDIA_LOCAL_DIR:uploads}
  local-public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:restaurant-menu}

hr:
  documents:
    # Private directory for employee documents. Must be persistent, shared between instances, and never web-served.
    dir: ${HR_DOCUMENTS_DIR:hr-documents}
  contracts:
    expiry-cron: ${HR_CONTRACT_EXPIRY_CRON:0 15 1 * * *}
  scheduling:
    # Fallback limits when no organisation or branch policy has been saved (Settings > Scheduling policy).
    # Business configuration only: set these to the labour rules that apply to you.
    default-min-rest-minutes: ${HR_DEFAULT_MIN_REST_MINUTES:480}
    default-max-shift-minutes: ${HR_DEFAULT_MAX_SHIFT_MINUTES:720}
    default-max-weekly-minutes: ${HR_DEFAULT_MAX_WEEKLY_MINUTES:2880}
  attendance:
    # Fallbacks until an organisation or branch attendance policy is saved (HR > Attendance > Rules).
    default-late-grace-minutes: ${HR_DEFAULT_LATE_GRACE_MINUTES:5}
    default-early-leave-grace-minutes: ${HR_DEFAULT_EARLY_LEAVE_GRACE_MINUTES:5}
    default-early-clock-in-minutes: ${HR_DEFAULT_EARLY_CLOCK_IN_MINUTES:30}
    # ALLOW records unscheduled clock-ins and flags them; BLOCK refuses them.
    default-unscheduled-clock-in: ${HR_DEFAULT_UNSCHEDULED_CLOCK_IN:ALLOW}
    default-require-correction-approval: ${HR_DEFAULT_REQUIRE_CORRECTION_APPROVAL:true}
    default-meal-break-paid: ${HR_DEFAULT_MEAL_BREAK_PAID:false}
    default-rest-break-paid: ${HR_DEFAULT_REST_BREAK_PAID:true}
    default-allow-self-clock: ${HR_DEFAULT_ALLOW_SELF_CLOCK:true}
    default-missed-clock-out-minutes: ${HR_DEFAULT_MISSED_CLOCK_OUT_MINUTES:120}
    pin-max-attempts: ${HR_CLOCK_PIN_MAX_ATTEMPTS:5}
    pin-lockout-minutes: ${HR_CLOCK_PIN_LOCKOUT_MINUTES:15}
  overtime:
    # Fallbacks until an overtime rule is saved (HR > Timesheets > Overtime rules). Business settings, not legal advice.
    default-daily-threshold-minutes: ${HR_DEFAULT_OT_DAILY_THRESHOLD_MINUTES:480}
    default-weekly-threshold-minutes: ${HR_DEFAULT_OT_WEEKLY_THRESHOLD_MINUTES:2880}
    default-daily-multiplier: ${HR_DEFAULT_OT_DAILY_MULTIPLIER:1.5}
    default-weekly-multiplier: ${HR_DEFAULT_OT_WEEKLY_MULTIPLIER:1.5}
    default-holiday-multiplier: ${HR_DEFAULT_OT_HOLIDAY_MULTIPLIER:2.0}
    default-requires-approval: ${HR_DEFAULT_OT_REQUIRES_APPROVAL:true}
  leave:
    # Weekdays not counted when a leave type counts WORKDAYS (public holidays are skipped too). Comma-separated MON..SUN.
    non-working-days: ${HR_LEAVE_NON_WORKING_DAYS:SAT,SUN}

inventory:
  block-when-insufficient: ${INVENTORY_BLOCK_WHEN_INSUFFICIENT:true}

email:
  provider: ${EMAIL_PROVIDER:log}
  from: ${EMAIL_FROM:no-reply@restaurant.local}

notifications:
  default-country-code: ${NOTIFICATIONS_DEFAULT_COUNTRY_CODE:233}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:log}
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:v20.0}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
  sms:
    provider: ${SMS_PROVIDER:log}
    sender-id: ${SMS_SENDER_ID:RestoMgr}
    hubtel-client-id: ${HUBTEL_CLIENT_ID:}
    hubtel-client-secret: ${HUBTEL_CLIENT_SECRET:}
    arkesel-api-key: ${ARKESEL_API_KEY:}

logging:
  level:
    root: INFO
  pattern:
    level: "%5p [${spring.application.name:},trace=%X{traceId:-},span=%X{spanId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
